# Server
server.port=8080

# H2 in-memory database (as required by the assessment)
spring.datasource.url=jdbc:h2:mem:enviro365db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console for inspecting data during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Load seed data after Hibernate creates the schema
spring.sql.init.mode=always

# Bean validation error messages should be readable, not stack traces
server.error.include-message=always
